<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Каравай и пряник</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/brand-logo-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF7EC;--text:#0D0D0D;--berry:#D63B52;--amber:#F5C63F;--line:rgba(46,27,18,.13)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Onest,system-ui,sans-serif;color:var(--text);background:var(--cream);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url('/images/bg.jpg') right top/cover no-repeat;opacity:.35}
.card{max-width:480px;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 30px;text-align:center;box-shadow:0 10px 30px rgba(46,27,18,.1)}
img{width:96px;height:96px;border-radius:50%}
.num{font-family:Bitter,serif;font-size:3.4rem;font-weight:700;color:var(--berry);margin:14px 0 0;line-height:1}
h1{font-family:Bitter,serif;font-size:1.45rem;margin:10px 0 10px}
p{margin:0 0 26px;line-height:1.55;color:#2a2a2a}
.btns{display:flex;flex-direction:column;gap:10px}
a.btn{display:block;padding:14px 20px;border-radius:999px;font-weight:600;text-decoration:none;transition:transform .15s}
a.btn:hover{transform:translateY(-2px)}
.fill{background:var(--berry);color:#fff}
.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<main class="card">
  <img src="/images/brand-logo-128.png" alt="Каравай и пряник">
  <div class="num">404</div>
  <h1>Такой страницы нет</h1>
  <p>Похоже, этот пряник уже съели 🙂<br>Загляните в каталог — там много свежих.</p>
  <div class="btns">
    <a class="btn fill" href="/#catalog">Смотреть каталог</a>
    <a class="btn ghost" href="/">На главную</a>
  </div>
</main>
</body>
</html>
